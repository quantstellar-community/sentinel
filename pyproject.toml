[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.12.11,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "kagglehub>=0.3.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "pandas>=2.2,<3",
    "plotly>=6.9.0",
    "pyarrow>=16,<19",
    "pyyaml>=6.0.2",
    "qiskit>=2.5.2",
    "qiskit-aer>=0.17.2",
    "qiskit-machine-learning>=0.9.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "taipy==4.1.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
extend-exclude = ["research/", "*.ipynb"]
