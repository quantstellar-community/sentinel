[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
    "kaggle>=2.2.4",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project root on the path so tests can import `scripts.*`. `src` is installed
# as a package; `scripts` deliberately is not, since it holds entry points
# rather than library code.
pythonpath = ["."]
